name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trip_planner
          POSTGRES_PASSWORD: trip-planner
          POSTGRES_DB: trip_planner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://trip_planner:trip-planner@localhost:5432/trip_planner_test"
      AUTH_SECRET: "ci-only-placeholder-secret-not-used-anywhere-real"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Test
        run: npm test
